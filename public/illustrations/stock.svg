  <polyline points="322,97 330,88 338,97" stroke="#059669" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Alert badge -->
  <circle cx="100" cy="100" r="16" fill="#059669"/>
  <text x="100" y="105" text-anchor="middle" fill="white" font-size="16" font-weight="700" font-family="system-ui">!</text>
