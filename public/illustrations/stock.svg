<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <circle cx="200" cy="150" r="130" fill="#059669" opacity="0.06"/>
  <!-- Boxes -->
  <rect x="120" y="140" width="60" height="50" rx="6" fill="#059669" opacity="0.15" stroke="#059669" stroke-width="2"/>
  <line x1="150" y1="140" x2="150" y2="190" stroke="#059669" stroke-width="1.5" opacity="0.3"/>
  <line x1="120" y1="165" x2="180" y2="165" stroke="#059669" stroke-width="1.5" opacity="0.3"/>

  <rect x="195" y="120" width="60" height="70" rx="6" fill="#059669" opacity="0.2" stroke="#059669" stroke-width="2"/>
  <line x1="225" y1="120" x2="225" y2="190" stroke="#059669" stroke-width="1.5" opacity="0.3"/>
  <line x1="195" y1="155" x2="255" y2="155" stroke="#059669" stroke-width="1.5" opacity="0.3"/>

  <rect x="270" y="155" width="50" height="35" rx="6" fill="#059669" opacity="0.1" stroke="#059669" stroke-width="2"/>
  <line x1="295" y1="155" x2="295" y2="190" stroke="#059669" stroke-width="1.5" opacity="0.3"/>

  <!-- Arrow up (restock) -->
  <circle cx="330" cy="100" r="18" fill="#059669" opacity="0.1"/>
