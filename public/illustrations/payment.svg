  <rect x="140" y="100" width="120" height="75" rx="8" fill="#059669" opacity="0.15" stroke="#059669" stroke-width="2"/>
  <text x="200" y="145" text-anchor="middle" fill="#059669" font-size="20" font-weight="700" font-family="system-ui">FCFA</text>
  <!-- Coins -->
  <circle cx="280" cy="170" r="18" fill="#059669" opacity="0.2" stroke="#059669" stroke-width="2"/>
  <text x="280" y="176" text-anchor="middle" fill="#059669" font-size="14" font-weight="600" font-family="system-ui">C</text>
  <circle cx="300" cy="185" r="15" fill="#059669" opacity="0.12" stroke="#059669" stroke-width="1.5"/>
  <!-- Checkmark -->
  <circle cx="200" cy="240" r="22" fill="#059669"/>
