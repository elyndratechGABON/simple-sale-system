  <!-- Receipt -->
  <rect x="90" y="130" width="40" height="55" rx="4" stroke="#059669" stroke-width="1.5" fill="white" opacity="0.8"/>
  <line x1="98" y1="142" x2="122" y2="142" stroke="#059669" stroke-width="1.5" opacity="0.3"/>
  <line x1="98" y1="150" x2="118" y2="150" stroke="#059669" stroke-width="1.5" opacity="0.3"/>
  <line x1="98" y1="158" x2="122" y2="158" stroke="#059669" stroke-width="1.5" opacity="0.3"/>
  <line x1="98" y1="166" x2="115" y2="166" stroke="#059669" stroke-width="1.5" opacity="0.3"/>
</svg>
