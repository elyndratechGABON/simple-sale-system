[install]
# Garde-fou chaîne d'approvisionnement : ignore toute version publiée depuis moins de
# 24 h. C'est la fenêtre pendant laquelle un paquet compromis circule avant d'être
# détecté et retiré.
minimumReleaseAge = 86400
# Chaque entrée contourne la garde de 24 h pour un paquet. Confirmer avec l'utilisateur
# avant d'en ajouter une.
minimumReleaseAgeExcludes = []
